name: CI
on: [push, pull_request]
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: {node-version: '22'}
      - run: npm ci --no-audit
      - run: npm audit --audit-level=low
      - run: npm audit --omit=dev --audit-level=low
      - run: npm run typecheck
      - run: npm run lint
      - run: npm test
      - run: npm run probe:prepare
      - run: npm run build
      - run: npx playwright install --with-deps chromium
      - run: npm run test:e2e
      - run: npm run cli -- scan probes --out report.json
      - run: npm run cli -- compare report.json report.json
      - uses: actions/upload-artifact@v4
        with: {name: compatibility-report, path: report.json}
